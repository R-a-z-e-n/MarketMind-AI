<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <!-- Sun Gradient -->
    <linearGradient id="shuroqSunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    
    <!-- Circuit Base Gradient -->
    <linearGradient id="shuroqCircuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Circuit Trace Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Group for Logo -->
  <g transform="translate(20, 20)">
    <!-- "Shur" Text -->
    <text x="10" y="115" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="105" fill="#0B192C" letter-spacing="-2">Shur</text>

    <!-- Emblem replacing 'o' (Center around x=315, y=70, radius=42) -->
    <g transform="translate(315, 72)">
      <!-- 3 Sun Rays -->
      <line x1="0" y1="-50" x2="0" y2="-62" stroke="#F59E0B" stroke-width="7" stroke-linecap="round" />
      <line x1="-22" y1="-44" x2="-29" y2="-55" stroke="#F59E0B" stroke-width="7" stroke-linecap="round" />
      <line x1="22" y1="-44" x2="29" y2="-55" stroke="#F59E0B" stroke-width="7" stroke-linecap="round" />

      <!-- Top Sun Hemisphere -->
      <path d="M -42 0 A 42 42 0 0 1 42 0 Z" fill="url(#shuroqSunGrad)" />

      <!-- Bottom Tech Circuit Hemisphere -->
      <path d="M -42 0 A 42 42 0 0 0 42 0 Z" fill="url(#shuroqCircuitGrad)" />

      <!-- Circuit Traces & Nodes -->
      <!-- Center Main Stem -->
      <path d="M 0 35 L 0 10 L -12 -5" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-12" cy="-5" r="4" fill="#38BDF8" />

      <!-- Left Circuit Trace -->
      <path d="M -28 20 L -18 20 L -6 5" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-6" cy="5" r="4" fill="#38BDF8" />

      <!-- Right Circuit Trace -->
      <path d="M 28 20 L 18 20 L 6 0 L 6 -15" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="6" cy="-15" r="4" fill="#38BDF8" />
      
      <!-- Far Right Branch -->
      <path d="M 12 18 L 22 8 L 22 -5" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="22" cy="-5" r="3.5" fill="#38BDF8" />
    </g>

    <!-- "q" Text -->
    <text x="368" y="115" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="105" fill="#0B192C" letter-spacing="-2">q</text>

    <!-- Tagline "TECH REDEFINED" -->
    <text x="290" y="155" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#1D4ED8" letter-spacing="7">TECH REDEFINED</text>
  </g>
</svg>
