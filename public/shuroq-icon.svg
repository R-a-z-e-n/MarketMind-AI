<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Card Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>

    <!-- Circuit Base -->
    <linearGradient id="iconCircuitBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container Badge -->
  <rect x="20" y="20" width="360" height="360" rx="72" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3" filter="url(#badgeShadow)" />

  <!-- Center Emblem Group -->
  <g transform="translate(200, 210)">
    <!-- 3 Top Sun Rays -->
    <line x1="0" y1="-120" x2="0" y2="-145" stroke="#F59E0B" stroke-width="14" stroke-linecap="round" />
    <line x1="-50" y1="-105" x2="-65" y2="-130" stroke="#F59E0B" stroke-width="14" stroke-linecap="round" />
    <line x1="50" y1="-105" x2="65" y2="-130" stroke="#F59E0B" stroke-width="14" stroke-linecap="round" />

    <!-- Top Sun Hemisphere -->
    <path d="M -100 0 A 100 100 0 0 1 100 0 Z" fill="url(#sunGlow)" />
    <!-- Sun Highlight Specular -->
    <ellipse cx="40" cy="-40" rx="15" ry="10" fill="#FFFFFF" opacity="0.4" transform="rotate(-20 40 -40)" />

    <!-- Bottom Tech Circuit Hemisphere -->
    <path d="M -100 0 A 100 100 0 0 0 100 0 Z" fill="url(#iconCircuitBase)" />

    <!-- Circuit Lines and Nodes -->
    <!-- Stem 1 -->
    <path d="M 0 85 L 0 25 L -30 -10" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-30" cy="-10" r="9" fill="#38BDF8" />

    <!-- Stem 2 -->
    <path d="M -65 50 L -40 50 L -15 10" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-15" cy="10" r="9" fill="#38BDF8" />

    <!-- Stem 3 -->
    <path d="M 65 50 L 40 50 L 15 0 L 15 -35" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="15" cy="-35" r="9" fill="#38BDF8" />

    <!-- Stem 4 -->
    <path d="M 30 45 L 50 20 L 50 -10" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="50" cy="-10" r="8" fill="#38BDF8" />
  </g>
</svg>
